name: hailbell
description: In-app support chat and push notifications for Flutter apps on iOS and Android, using Hailbell's native SDKs.
version: 0.1.0
homepage: https://hailbell.com
repository: https://github.com/vidursaini/hailbell-flutter
issue_tracker: https://github.com/vidursaini/hailbell-flutter/issues
documentation: https://github.com/vidursaini/hailbell-flutter/blob/main/GUIDE.md
topics:
  - chat
  - support
  - push-notifications
  - customer-support

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.hailbell.flutter
        pluginClass: HailbellPlugin
      ios:
        pluginClass: HailbellPlugin
